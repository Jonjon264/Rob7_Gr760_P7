services:


  humble_dev:
    build:
      context: ../..
      dockerfile: ./Docker/Semantics/Dockerfile
    container_name: Semantics
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ../../ros2_ws
        target: /root/ros2_ws

      - type: bind
        source: ../../Semantics-Py
        target: /root/Semantics-Py
      
      - type: bind
        source: ../../Map/MapFiles/Map1/waypoints.json
        target: /root/waypoints.json

    environment:
      - ROS_DOMAIN_ID=0
  
  
  localai:
    build:
      context: ../..
      dockerfile: ./Docker/Semantics/Dockerfile1
    container_name: LocalAI
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    #volumes:
      # - type: bind
      #   source: ../../ros2_ws
      #   target: /root/ros2_ws
      
    environment:
    - ROS_DOMAIN_ID=1

