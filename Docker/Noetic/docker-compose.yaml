services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ros_noetic

    stdin_open: true
    tty: true

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"

    volumes:
      - ../../workspace:/catkin_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    network_mode: host

    privileged: true
