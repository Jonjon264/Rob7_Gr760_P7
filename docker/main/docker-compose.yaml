services:
  humble_dev:
    build:
      context: ../..
      dockerfile: ./docker/main/Dockerfile
    container_name: x30_Main
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ../../ros2_ws
        target: /root/ros2_ws
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1