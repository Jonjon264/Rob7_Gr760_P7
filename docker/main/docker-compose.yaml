services:
  humble_dev:
    build:
      context: ../..
      dockerfile: ./docker/main/Dockerfile
    container_name: x30_Main
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    # Microphone and speaker access goes through the host PulseAudio server.
    volumes:
      - type: bind
        source: ../../ros2_ws
        target: /root/ros2_ws

      # Piper requires the voice model and its companion configuration.
      - type: bind
        source: ../../AI_Interface/en_US-hfc_male-medium.onnx
        target: /opt/piper/en_US-hfc_male-medium.onnx
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../AI_Interface/en_US-hfc_male-medium.onnx.json
        target: /opt/piper/en_US-hfc_male-medium.onnx.json
        read_only: true
        bind:
          create_host_path: false

      # Connect to the host audio server
      - type: bind
        source: /run/user/1000/pulse/native
        target: /tmp/pulse-native
        read_only: true
      - type: bind
        source: /home/a/.config/pulse/cookie
        target: /tmp/pulse-cookie
        read_only: true

    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - PIPER_MODEL=/opt/piper/en_US-hfc_male-medium.onnx

      # Tell audio applications how to connect ( kun på mit pc, skal nok slettes)
      - PULSE_SERVER=unix:/tmp/pulse-native
      - PULSE_COOKIE=/tmp/pulse-cookie
