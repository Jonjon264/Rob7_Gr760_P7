services:
  ros1_bridge:
    build:
      context: ../..
      dockerfile: ./docker/bridge/Dockerfile
    network_mode: host
    ipc: host
    environment:
      - ROS_MASTER_URI=http://192.168.1.106:11311
      - ROS_IP=192.168.1.131
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config/topics.yaml:/topics.yaml:ro
    restart: on-failure
    extra_hosts:
      - "ysc-perception:192.168.1.106"  
    command:
      - bash
      - -c
      - |
        set -e
        source /opt/ros/noetic/setup.bash
        source /ros1_ws/devel/setup.bash
        rosparam load /topics.yaml
        unset ROS_NAME
        source /opt/ros/foxy/setup.bash
        source /ros2_ws/install/setup.bash
        exec ros2 run ros1_bridge parameter_bridge
  real_sense_republish:
    build:
      context: ../..
      dockerfile: ./docker/bridge/Dockerfile2
    network_mode: host
    privileged: true
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /tpm/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      
    